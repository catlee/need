[package]
name = "need"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
fs2 = "0.4"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-escape = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }
signal-hook = "0.3"
